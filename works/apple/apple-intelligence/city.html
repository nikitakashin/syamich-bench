<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3D Киберпанк-город с Three.js</title>
  <script type="application/javascript">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

    // Сцена, камера иrenderer
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Установка камеры
    camera.position.z = 15;

    // Световые источники
    const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
    scene.add(ambientLight);

    const neonLight = new THREE.DirectionalLight(0xff0000, 1);
    neonLight.position.set(5, 5, 5);
    scene.add(neonLight);

    // Создание объекта-город
    function createBuilding(x, z, height, color) {
      const geometry = new THREE.BoxGeometry(height * 1.5, height * 0.5, height * 1.5);
      const material = new THREE.MeshPhongMaterial({ 
        color: color,
        specular: 0x888888,
        shininess: 100
      });
      const building = new THREE.Mesh(geometry, material);
      building.position.set(x, height * 0.25, z);
      scene.add(building);

      // Окна
      const windowGeometry = new THREE.BoxGeometry(0.3, 0.1, 0.2);
      const windowMaterial = new THREE.MeshPhongMaterial({ color: 0x00ffff, transparent: true, opacity: 0.8 });
      for (let i = 0; i < 5; i++) {
        const window = new THREE.Mesh(windowGeometry, windowMaterial);
        window.position.set(
          x + 0.8 + Math.random() * 0.4,
          height * 0.4 + 0.5,
          z + i * 1.2
        );
        scene.add(window);
      }
      return building;
    }

    // Создание нескольких зданий
    const buildings = [];
    for (let i = 0; i < 8; i++) {
      const x = (i - 4) * 6;
      const z = (i - 4) * 4;
      const height = Math.random() * 10 + 5;
      const color = Math.random() > 0.5 ? 0x0000ff : 0xff0000; // синий или красный
      buildings.push(createBuilding(x, z, height, color));
    }

    // Создание асфальта (мокрое покрытие)
    const groundGeometry = new THREE.PlaneGeometry(40, 40);
    const groundMaterial = new THREE.MeshPhongMaterial({ 
      color: 0x222222,
      specular: 0x444444,
      shininess: 50
    });
    const ground = new THREE.Mesh(groundGeometry, groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -1;
    scene.add(ground);

    // Создание тумана
    const fogGeometry = new THREE.SphereGeometry(10, 10, 10);
    const fogMaterial = new THREE.FogExp2(0x000000, 0.002);
    const fog = new THREE.Mesh(fogGeometry, fogMaterial);
    scene.add(fog);

    // Создание неоновых вывесок
    function createNeonSign(x, z) {
      const geometry = new THREE.BoxGeometry(2, 0.2, 0.5);
      const material = new THREE.MeshPhongMaterial({ 
        color: 0x00ffff,
        transparent: true,
        opacity: 0.9,
        emissive: 0xff0000,
        emissiveIntensity: 0.8
      });
      const sign = new THREE.Mesh(geometry, material);
      sign.position.set(x, 0.1, z + 2);
      scene.add(sign);
    }
    for (let i = 0; i < 12; i++) {
      const x = (i - 6) * 4;
      createNeonSign(x, 0);
    }

    // Создание летающих машин
    function createCar(x, z) {
      const carGroup = new THREE.Group();
      const bodyGeometry = new THREE.BoxGeometry(1, 0.6, 1);
      const bodyMaterial = new THREE.MeshPhongMaterial({ color: 0x333333 });
      const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
      body.position.y = 0.3;
      carGroup.add(body);

      const wheelsGeometry = new THREE.CylinderGeometry(0.2, 0.2, 0.1, 8);
      const wheelsMaterial = new THREE.MeshPhongMaterial({ color: 0x555555 });
      for (let i = 0; i < 4; i++) {
        const wheel = new THREE.Mesh(wheelsGeometry, wheelsMaterial);
        wheel.position.set(
          -0.3, 0.1, -0.5 + i * 0.8
        );
        carGroup.add(wheel);
      }

      const headlight = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
      headlight.position.set(0, 0.7, 0.5);
      carGroup.add(headlight);

      const car = carGroup;
      car.position.set(x, 0, z);
      scene.add(car);

      // Световые следы
      const trailGeometry = new THREE.BufferGeometry();
      const trailPoints = [];
      for (let i = 0; i < 10; i++) {
        trailPoints[i] = new THREE.Vector3(
          Math.random() * 10 - 5,
          0.5 + Math.random() * 0.5,
          Math.random() * 10 - 5
        );
        trailPoints[i].y = 0.5 + Math.random() * 0.5;
      }
      trailGeometry.setAttribute('position', new THREE.Float32BufferAttribute(trailPoints, 3));
      const trail = new THREE.LineSegments(trailGeometry, new THREE.LineBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0.3 }));
      car.add(trail);
      return car;
    }
    for (let i = 0; i < 6; i++) {
      const x = (i - 3) * 7;
      const z = (i - 3) * 4;
      createCar(x, z);
    }

    // Установка ориентации камеры
    camera.position.z = 15;

    // Область управления (OrbitControls)
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enableStickyTouch = true;
    controls.update();

    // Анимация
    function animate() {
      requestAnimationFrame(animate);

      // Метод для плавного движения камеры между домами
      const time = Date.now() * 0.001;
      const angle = time * 0.02;
      const radius = 20;
      const targetX = Math.cos(angle) * radius;
      const targetZ = Math.sin(angle) * radius;

      // Позиционирование камеры
      camera.position.x = targetX;
      camera.position.z = targetZ;
      camera.lookAt(0, 1, 0);

      // Анимация летающих машин
      const speed = 0.005 + Math.random() * 0.002;
      for (const car of buildings) {
        car.position.x += speed * 0.1;
        if (car.position.x > 10) car.position.x = -10; // циклическая перемещение
        // Анимирование следов
        const trail = car.children[2];
        if (trail) {
          trail.geometry.attributes.position.needsUpdate = true;
          const positions = trail.geometry.attributes.position.array;
          for (let i = 0; i < positions.length; i += 3) {
            positions[i] += Math.random() * 0.01;
          }
        }
      }

      renderer.render(scene, camera);
    }

    // Реакция на изменение размера окна
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</head>
<body>
  <script>
    // Запуск анимации
    // Этот код выполняется сразу после загрузки страницы
    window.onload = () => {
      animate();
    };
  </script>
</body>
</html>
