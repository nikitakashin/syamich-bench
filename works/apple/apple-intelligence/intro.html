<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Native Сямыч - Заставка</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0f;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .title {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: #0af;
      font-size: 6rem;
      font-weight: bold;
      text-shadow: 0 0 15px #0af, 0 0 30px #0af;
      opacity: 0;
      transition: opacity 2s ease-in-out;
      pointer-events: none;
    }

    .subtitle {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      color: #0af;
      font-size: 3.5rem;
      font-weight: 300;
      opacity: 0;
      transition: opacity 2s ease-in-out;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const width = canvas.width = 1080;
    const height = canvas.height = 1920;

    const title = document.createElement('div');
    title.className = 'title';
    title.textContent = 'СЯМЫЧ';
    document.body.appendChild(title);

    const subtitle = document.createElement('div');
    subtitle.className = 'subtitle';
    subtitle.textContent = 'AI Native';
    document.body.appendChild(subtitle);

    let animationId;
    let startTime;

    function animate() {
      const currentTime = Date.now();
      const elapsed = currentTime - startTime;
      const duration = 5000; // 5 секунд

      if (elapsed > duration) {
        // Повторяем анимацию с начала
        startTime = currentTime - duration;
        animate();
        return;
      }

      // Вертикальный кадр 9:16 (1080×1920)
      const gradient = ctx.createLinearGradient(0, 0, 0, height);
      gradient.addColorStop(0, '#0a0a0f');
      gradient.addColorStop(1, '#0a0a0f');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);

      // Неонный фон с глитчем
      ctx.fillStyle = '#0af';
      for (let i = 0; i < 100; i++) {
        const x = Math.random() * width;
        const y = Math.random() * height;
        const size = Math.random() * 20 + 10;
        ctx.fillRect(x, y, size, size);
      }

      // Код-эффект
      ctx.fillStyle = '#0af';
      ctx.font = 'bold 60px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('AI', width / 2, height / 2 - 50);

      // Энергетический взлёт
      if (Math.random() < 0.3) {
        ctx.beginPath();
        ctx.moveTo(width / 2, height / 2);
        ctx.lineTo(width / 2, height / 2 - 100);
        ctx.strokeStyle = '#ff0';
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(width / 2, height / 2 + 100);
        ctx.lineTo(width / 2, height / 2);
        ctx.strokeStyle = '#ff0';
        ctx.lineWidth = 4;
        ctx.stroke();
      }

      // Анимирование текста
      const t = elapsed / duration;
      const titleOpacity = t > 0.5 ? 1 : t > 0.2 ? 0.8 : 0;
      const subtitleOpacity = t > 0.5 ? 1 : t > 0.2 ? 0.6 : 0;

      title.style.opacity = titleOpacity;
      subtitle.style.opacity = subtitleOpacity;

      animationId = requestAnimationFrame(animate);
    }

    // Начало анимации
    startTime = Date.now();
    animate();
  </script>
</body>
</html>
