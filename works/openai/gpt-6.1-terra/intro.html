<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Native Сямыч</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #03040b;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<canvas id="screen"></canvas>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d', { alpha: false });
  const W = 1080;
  const H = 1920;
  const TAU = Math.PI * 2;
  let width, height, dpr, scale, ox, oy;

  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    scale = Math.min(width / W, height / H);
    ox = (width - W * scale) / 2;
    oy = (height - H * scale) / 2;
  }
  window.addEventListener('resize', resize);
  resize();

  function rand(seed) {
    const x = Math.sin(seed * 127.1 + 311.7) * 43758.5453123;
    return x - Math.floor(x);
  }
  const clamp = x => Math.max(0, Math.min(1, x));
  const smooth = x => {
    x = clamp(x);
    return x * x * (3 - 2 * x);
  };
  const mix = (a, b, t) => a + (b - a) * t;

  const particles = Array.from({ length: 95 }, (_, i) => ({
    x: rand(i + 1) * W,
    y: rand(i + 200) * H,
    size: 0.6 + rand(i + 400) * 2,
    speed: 12 + rand(i + 600) * 42,
    phase: rand(i + 800) * TAU,
    cyan: rand(i + 1000) > 0.3
  }));

  const nodes = Array.from({ length: 48 }, (_, i) => {
    const a = rand(i + 1200) * TAU;
    const r = 170 + rand(i + 1300) * 360;
    return {
      x: Math.cos(a) * r,
      y: Math.sin(a) * r * 1.12,
      size: 1.5 + rand(i + 1400) * 3,
      phase: rand(i + 1500) * TAU
    };
  });

  const connections = [];
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const dx = nodes[i].x - nodes[j].x;
      const dy = nodes[i].y - nodes[j].y;
      if (Math.hypot(dx, dy) < 145 && rand(i * 71 + j * 17) > 0.35) {
        connections.push([i, j]);
      }
    }
  }

  function line(x1, y1, x2, y2, color, lineWidth = 1) {
    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  function circle(x, y, radius, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, TAU);
    ctx.fill();
  }

  function trackedText(text, x, y, spacing, align = 'center') {
    const chars = Array.from(text);
    const total = chars.reduce((sum, char) => sum + ctx.measureText(char).width, 0)
      + spacing * (chars.length - 1);
    let pos = align === 'center' ? x - total / 2 : x;
    for (const char of chars) {
      ctx.fillText(char, pos, y);
      pos += ctx.measureText(char).width + spacing;
    }
  }

  function polygon(sides, radius, rotation) {
    ctx.beginPath();
    for (let i = 0; i <= sides; i++) {
      const a = rotation + i * TAU / sides;
      const x = Math.cos(a) * radius;
      const y = Math.sin(a) * radius;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  function background(t) {
    const g = ctx.createRadialGradient(
      width / 2, height * 0.48, 0,
      width / 2, height * 0.48, Math.max(width, height) * 0.75
    );
    g.addColorStop(0, '#10132c');
    g.addColorStop(0.45, '#070a18');
    g.addColorStop(1, '#020309');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, width, height);

    ctx.save();
    ctx.translate(ox, oy);
    ctx.scale(scale, scale);

    const glow = ctx.createRadialGradient(540, 900, 10, 540, 900, 670);
    glow.addColorStop(0, 'rgba(38, 78, 140, 0.22)');
    glow.addColorStop(0.42, 'rgba(20, 36, 82, 0.11)');
    glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    // Perspective grid.
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 1110, W, 810);
    ctx.clip();
    const horizon = 1120;
    for (let i = -9; i <= 9; i++) {
      line(540, horizon, 540 + i * 260, 1920, 'rgba(60, 117, 167, 0.09)');
    }
    for (let i = 0; i < 12; i++) {
      const p = (i + (t * 0.35) % 1) / 12;
      const y = horizon + p * p * 900;
      line(0, y, W, y, `rgba(67, 120, 170, ${0.025 + p * 0.07})`);
    }
    ctx.restore();

    // Stars and data particles.
    for (const p of particles) {
      const y = (p.y - t * p.speed + H) % H;
      const flicker = 0.35 + 0.35 * Math.sin(t * 2 + p.phase);
      circle(p.x, y, p.size, p.cyan
        ? `rgba(113, 230, 255, ${flicker})`
        : `rgba(185, 114, 255, ${flicker * 0.7})`);
      if (p.size > 2.1) {
        line(p.x, y + 5, p.x, y + 18 + p.speed * 0.25,
          `rgba(99, 200, 255, ${flicker * 0.2})`);
      }
    }

    ctx.restore();
  }

  function frame(t, intro) {
    ctx.save();
    ctx.globalAlpha = intro;

    // Architectural corner marks.
    ctx.strokeStyle = 'rgba(126, 218, 244, 0.34)';
    ctx.lineWidth = 2;
    const corners = [
      [68, 86, 1, 1], [1012, 86, -1, 1],
      [68, 1834, 1, -1], [1012, 1834, -1, -1]
    ];
    for (const [x, y, sx, sy] of corners) {
      ctx.beginPath();
      ctx.moveTo(x, y + sy * 48);
      ctx.lineTo(x, y);
      ctx.lineTo(x + sx * 48, y);
      ctx.stroke();
    }

    ctx.font = '600 19px monospace';
    ctx.fillStyle = 'rgba(177, 221, 238, 0.72)';
    ctx.fillText('SYSTEM / ONLINE', 92, 130);
    ctx.textAlign = 'right';
    ctx.fillText('AI_NATIVE // 01', 988, 130);
    ctx.textAlign = 'left';

    line(92, 155, 988, 155, 'rgba(130, 211, 239, 0.14)');
    line(92, 1765, 988, 1765, 'rgba(130, 211, 239, 0.14)');

    ctx.font = '18px monospace';
    ctx.fillStyle = 'rgba(141, 192, 211, 0.55)';
    ctx.fillText('CREATIVE INTELLIGENCE', 92, 1805);
    ctx.textAlign = 'right';
    ctx.fillText('EST. IN THE FUTURE', 988, 1805);
    ctx.textAlign = 'left';

    // Side rulers.
    for (let i = 0; i < 25; i++) {
      const y = 510 + i * 37;
      const len = i % 5 === 0 ? 18 : 8;
      line(70, y, 70 + len, y, 'rgba(115, 202, 226, 0.23)');
      line(1010 - len, y, 1010, y, 'rgba(115, 202, 226, 0.23)');
    }

    ctx.restore();
  }

  function core(t, intensity) {
    ctx.save();
    ctx.translate(540, 890);
    ctx.globalAlpha = intensity;

    const halo = ctx.createRadialGradient(0, 0, 20, 0, 0, 530);
    halo.addColorStop(0, 'rgba(107, 222, 255, 0.19)');
    halo.addColorStop(0.25, 'rgba(32, 147, 231, 0.10)');
    halo.addColorStop(0.58, 'rgba(126, 65, 215, 0.06)');
    halo.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = halo;
    ctx.fillRect(-550, -550, 1100, 1100);

    // Neural network.
    ctx.save();
    ctx.rotate(t * 0.025);
    for (const [a, b] of connections) {
      const n1 = nodes[a], n2 = nodes[b];
      line(n1.x, n1.y, n2.x, n2.y, 'rgba(109, 202, 255, 0.13)');
    }
    for (const n of nodes) {
      const pulse = 0.4 + 0.35 * Math.sin(t * 2.5 + n.phase);
      circle(n.x, n.y, n.size, `rgba(144, 231, 255, ${pulse})`);
      if (n.size > 3.6) {
        circle(n.x, n.y, n.size * 3, 'rgba(81, 205, 255, 0.04)');
      }
    }
    ctx.restore();

    // Rotating geometric instruments.
    ctx.save();
    ctx.rotate(t * 0.12);
    ctx.strokeStyle = 'rgba(108, 217, 255, 0.20)';
    ctx.lineWidth = 1.5;
    polygon(6, 370, Math.PI / 6);
    ctx.rotate(-t * 0.22);
    ctx.strokeStyle = 'rgba(178, 108, 255, 0.17)';
    polygon(6, 320, Math.PI / 6);
    ctx.restore();

    ctx.save();
    ctx.rotate(-t * 0.16);
    ctx.strokeStyle = 'rgba(101, 218, 255, 0.38)';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 14, 60, 14, 3, 28]);
    ctx.beginPath();
    ctx.arc(0, 0, 430, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    ctx.save();
    ctx.rotate(t * 0.25);
    ctx.strokeStyle = 'rgba(185, 120, 255, 0.33)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 464, 0.15, 1.08);
    ctx.arc(0, 0, 464, 3.28, 4.23);
    ctx.stroke();
    circle(464, 0, 5, '#a7f6ff');
    circle(-464, 0, 3, '#c292ff');
    ctx.restore();

    for (let i = 0; i < 64; i++) {
      const a = i * TAU / 64;
      const inner = i % 8 === 0 ? 480 : 489;
      const outer = 497;
      line(
        Math.cos(a) * inner, Math.sin(a) * inner,
        Math.cos(a) * outer, Math.sin(a) * outer,
        i % 8 === 0 ? 'rgba(136, 224, 255, 0.55)' : 'rgba(136, 224, 255, 0.19)'
      );
    }

    ctx.restore();
  }

  function codeFragments(t, opacity) {
    ctx.save();
    ctx.globalAlpha = opacity;
    ctx.font = '20px monospace';
    const rows = [
      ['01', 'const future = create();'],
      ['02', 'model.connect(neurons);'],
      ['03', 'while (idea) {'],
      ['04', '  build();'],
      ['05', '}']
    ];
    rows.forEach((row, i) => {
      const y = 1440 + i * 32;
      ctx.fillStyle = 'rgba(102, 181, 212, 0.40)';
      ctx.fillText(row[0], 115, y);
      ctx.fillStyle = i === 2 ? 'rgba(196, 137, 255, 0.56)' : 'rgba(152, 213, 230, 0.45)';
      ctx.fillText(row[1], 165, y);
    });

    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(122, 218, 245, 0.53)';
    ctx.fillText('NEURAL ENGINE', 965, 1450);
    ctx.fillStyle = 'rgba(160, 192, 218, 0.36)';
    ctx.fillText('SIGNAL / ACTIVE', 965, 1484);
    ctx.fillText('LATENCY / 00.01', 965, 1518);
    ctx.textAlign = 'left';

    const progress = smooth(t / 2.1);
    ctx.fillStyle = 'rgba(105, 193, 222, 0.13)';
    ctx.fillRect(756, 1543, 209, 3);
    ctx.fillStyle = 'rgba(113, 233, 255, 0.65)';
    ctx.fillRect(756, 1543, 209 * progress, 3);
    ctx.restore();
  }

  function title(t) {
    const reveal = smooth((t - 1.65) / 0.48);
    const out = 1 - smooth((t - 4.55) / 0.4);
    const alpha = reveal * out;
    if (alpha <= 0) return;

    const settling = 1 - smooth((t - 1.65) / 0.72);
    const glitch = settling * (Math.sin(t * 81) > 0.25 ? 1 : 0);
    const y = 935 + settling * 22;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Dark glass under the title keeps the lettering crisp.
    const plate = ctx.createLinearGradient(0, y - 170, 0, y + 180);
    plate.addColorStop(0, 'rgba(4, 8, 20, 0)');
    plate.addColorStop(0.3, 'rgba(4, 8, 20, 0.72)');
    plate.addColorStop(0.7, 'rgba(4, 8, 20, 0.72)');
    plate.addColorStop(1, 'rgba(4, 8, 20, 0)');
    ctx.fillStyle = plate;
    ctx.fillRect(55, y - 170, 970, 350);

    ctx.font = '900 218px Arial, Helvetica, sans-serif';

    if (glitch) {
      ctx.globalAlpha = alpha * 0.65;
      ctx.fillStyle = '#50eaff';
      ctx.fillText('СЯМЫЧ', 540 - 12 * glitch, y, 900);
      ctx.fillStyle = '#ff62df';
      ctx.fillText('СЯМЫЧ', 540 + 12 * glitch, y, 900);
      ctx.globalAlpha = alpha;
    }

    ctx.shadowColor = 'rgba(89, 218, 255, 0.65)';
    ctx.shadowBlur = 34;
    const textGradient = ctx.createLinearGradient(0, y - 120, 0, y + 100);
    textGradient.addColorStop(0, '#ffffff');
    textGradient.addColorStop(0.55, '#f3fbff');
    textGradient.addColorStop(1, '#9edaf4');
    ctx.fillStyle = textGradient;
    ctx.fillText('СЯМЫЧ', 540, y, 900);
    ctx.shadowBlur = 0;

    // Fine accent and subtitle.
    const sub = smooth((t - 2.0) / 0.5);
    ctx.globalAlpha = alpha * sub;
    line(205, y + 143, 356, y + 143, 'rgba(91, 225, 255, 0.55)', 2);
    line(724, y + 143, 875, y + 143, 'rgba(186, 126, 255, 0.55)', 2);
    circle(375, y + 143, 3, '#7eeaff');
    circle(705, y + 143, 3, '#c38cff');

    ctx.fillStyle = '#dbf6ff';
    ctx.font = '600 48px Arial, Helvetica, sans-serif';
    ctx.textAlign = 'left';
    trackedText('AI Native', 540, y + 145, 6);

    ctx.font = '19px monospace';
    ctx.fillStyle = 'rgba(156, 218, 239, 0.65)';
    trackedText('CODE  /  CREATE  /  EVOLVE', 540, y + 215, 4);

    ctx.restore();
  }

  function flash(t) {
    const amount = Math.max(0, 1 - Math.abs(t - 1.76) / 0.16);
    if (amount <= 0) return;
    ctx.save();
    ctx.globalAlpha = amount * 0.24;
    ctx.fillStyle = '#b6f5ff';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  function render(now) {
    const t = (now % 5000) / 1000;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    background(t);

    ctx.save();
    ctx.translate(ox, oy);
    ctx.scale(scale, scale);

    const intro = smooth(t / 0.7);
    frame(t, intro);
    core(t, smooth((t - 0.15) / 1.2));
    codeFragments(t, smooth((t - 0.65) / 0.8));
    title(t);
    flash(t);

    // Subtle scanlines.
    ctx.fillStyle = 'rgba(0, 0, 0, 0.07)';
    for (let y = 0; y < H; y += 5) ctx.fillRect(0, y, W, 1);

    // Fade to black at the loop boundary.
    const fade = Math.max(1 - smooth(t / 0.25), smooth((t - 4.65) / 0.35));
    if (fade > 0) {
      ctx.fillStyle = `rgba(2, 3, 9, ${fade})`;
      ctx.fillRect(0, 0, W, H);
    }

    ctx.restore();
    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);
 })();
</script>
</body>
</html>
